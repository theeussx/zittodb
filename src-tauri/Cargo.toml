[package]
name = "zittodb"
version = "0.1.5"
description = "Zittodb — Android Debug Bridge, direct and local. Lightweight ADB/scrcpy/fastboot GUI for Linux."
authors = ["theeussx"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "zittodb_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "5"
chrono = "0.4"
libc = "0.2"

# A deliberately small dependency set:
# no database, no web server, no telemetry.
#
# Long-running processes such as scrcpy, shell and logcat
# are managed by our own process manager so nothing is
# left orphaned.

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
